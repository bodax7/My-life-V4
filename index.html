:root {
  --nile: #0f3d3e;        /* الهوية */
  --nile-2: #165a5a;
  --nile-tint: #e3eeec;
  --gold: #a87b1e;        /* الذهب والأصول فقط */
  --gold-tint: #f6eedb;
  --in: #1d7348;          /* دخل */
  --out: #b23a33;         /* مصروف */
  --warn: #a86414;
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eef1f0;
  --line: #dbe2e0;
  --ink: #122426;
  --ink-2: #4c5f61;
  --ink-3: #7d8d8f;
  --focus: #2f7dd1;
  --radius-s: 8px; --radius-m: 14px; --radius-l: 22px;
  --shadow: 0 1px 0 rgba(15,61,62,.06), 0 8px 24px -12px rgba(15,61,62,.22);
  --nav-h: 68px;
  --fs-xs: .75rem; --fs-s: .875rem; --fs-m: 1rem; --fs-l: 1.25rem; --fs-xl: 1.625rem; --fs-xxl: 2.5rem;
  color-scheme: light;
}
[data-theme="dark"] {
  --nile: #7cc6bd; --nile-2: #9ad6ce; --nile-tint: #17302f;
  --gold: #d9b45c; --gold-tint: #2c2615;
  --in: #5cc58c; --out: #f07b72; --warn: #e3a356;
  --bg: #0d1719; --surface: #142225; --surface-2: #1a2b2e; --line: #253a3d;
  --ink: #e6efee; --ink-2: #a9bcbc; --ink-3: #7a8f90;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --nile: #7cc6bd; --nile-2: #9ad6ce; --nile-tint: #17302f;
    --gold: #d9b45c; --gold-tint: #2c2615;
    --in: #5cc58c; --out: #f07b72; --warn: #e3a356;
    --bg: #0d1719; --surface: #142225; --surface-2: #1a2b2e; --line: #253a3d;
    --ink: #e6efee; --ink-2: #a9bcbc; --ink-3: #7a8f90;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: Plex, system-ui, sans-serif; font-size: var(--fs-m); line-height: 1.6;
  background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--nile-2); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums lining-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: var(--fs-s); }
.in { color: var(--in); } .out { color: var(--out); } .gold { color: var(--gold); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- الإقلاع ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--nile); font-weight: 600; }
.boot-mark { width: 56px; height: 56px; border-radius: 18px; background: var(--nile); position: relative; overflow: hidden; }
.boot-mark::after { content: ""; position: absolute; inset: 0; background: repeating-radial-gradient(circle at 30% 120%, transparent 0 5px, rgba(255,255,255,.18) 5px 6px); }

/* ---------- الهيكل ---------- */
.shell { min-height: 100vh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid transparent;
}
.topbar h1 { font-size: var(--fs-l); margin: 0; flex: 1; font-weight: 700; letter-spacing: -.01em; }
.page { max-width: 760px; margin: 0 auto; padding: 8px 16px 24px; }
.stack > * + * { margin-top: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.bottomnav {
  position: fixed; inset: auto 0 0 0; z-index: 30; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
}
.bottomnav a { display: grid; place-items: center; align-content: center; gap: 2px; text-decoration: none; color: var(--ink-3); font-size: .7rem; font-weight: 500; }
.bottomnav a[aria-current="page"] { color: var(--nile); }
.bottomnav a svg { width: 24px; height: 24px; }
.bottomnav .fab { margin-top: -18px; }
.bottomnav .fab span.fab-btn {
  width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center;
  background: var(--nile); color: var(--surface); box-shadow: var(--shadow);
}
[data-theme="dark"] .bottomnav .fab span.fab-btn { color: #0d1719; }
@media (min-width: 900px) {
  .shell { padding-bottom: 0; padding-inline-start: 96px; }
  .bottomnav { inset: 0 0 0 auto; width: 96px; height: 100vh; grid-template-columns: 1fr; grid-auto-rows: 76px; align-content: start; padding-top: 24px; border-top: 0; border-inline-start: 1px solid var(--line); }
  [dir="ltr"] .bottomnav { inset: 0 auto 0 0; }
  .bottomnav .fab { margin-top: 0; }
}

/* ---------- البطاقات والقوائم ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; }
.panel h2 { font-size: var(--fs-m); margin: 0 0 8px; font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); overflow: hidden; }
.list > li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; }
.list > li + li { border-top: 1px solid var(--line); }
.list > li.tap { cursor: pointer; }
.list > li.tap:active { background: var(--surface-2); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--nile-tint); color: var(--nile); font-weight: 700; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
.chip.nile { background: var(--nile-tint); color: var(--nile); }
.chip.gold { background: var(--gold-tint); color: var(--gold); }
.chip.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.chip.out { background: color-mix(in srgb, var(--out) 12%, transparent); color: var(--out); }
.section-title { font-size: var(--fs-s); font-weight: 600; color: var(--ink-2); margin: 22px 4px 8px; }

/* ---------- الأزرار ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 14px; border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none;
  background: var(--nile); color: var(--surface); transition: transform .08s ease;
}
[data-theme="dark"] .btn.primary, [data-theme="dark"] .btn:not(.ghost):not(.quiet):not(.danger) { color: #0d1719; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: transparent; color: var(--out); border-color: color-mix(in srgb, var(--out) 35%, transparent); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: var(--fs-s); border-radius: 10px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- النماذج ---------- */
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-size: var(--fs-s); font-weight: 600; color: var(--ink-2); }
.input {
  width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--nile-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--nile-2) 18%, transparent); }
.input[aria-invalid="true"] { border-color: var(--out); }
textarea.input { min-height: 96px; resize: vertical; }
.input-wrap { position: relative; }
.input-wrap .input { padding-inline-end: 52px; }
.input-wrap .icon-btn { position: absolute; inset-inline-end: 3px; top: 3px; }
.hint { font-size: var(--fs-xs); color: var(--ink-3); }
.err { font-size: var(--fs-s); color: var(--out); }
.strength { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; }
.strength i { height: 4px; border-radius: 4px; background: var(--line); }
.strength[data-s="1"] i:nth-child(-n+1) { background: var(--out); }
.strength[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
.strength[data-s="3"] i:nth-child(-n+3) { background: var(--nile-2); }
.strength[data-s="4"] i { background: var(--in); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: inset-inline-start .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch:checked { background: var(--nile-2); }
.switch:checked::after { inset-inline-start: 21px; }

/* ---------- شاشات الدخول ---------- */
.auth { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
.auth-hero { position: relative; overflow: hidden; background: var(--nile); color: #eaf4f2; padding: calc(env(safe-area-inset-top) + 40px) 24px 56px; }
[data-theme="dark"] .auth-hero { background: #0f3d3e; }
.auth-hero h1 { margin: 0; font-size: 2.25rem; font-weight: 700; letter-spacing: -.02em; }
.auth-hero p { margin: 6px 0 0; opacity: .82; max-width: 30ch; }
.auth-body { margin-top: -28px; background: var(--bg); border-radius: 28px 28px 0 0; padding: 28px 20px 40px; position: relative; }
.auth-body .inner { max-width: 440px; margin: 0 auto; }
.auth h2 { font-size: var(--fs-xl); margin: 0 0 4px; }

/* نقشة خطوط البنكنوت — العنصر المميز */
.guilloche { position: absolute; inset: 0; pointer-events: none; opacity: .5; }
.guilloche path { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 1; }

/* ---------- لوحة الرئيسية ---------- */
.wealth { position: relative; overflow: hidden; border-radius: var(--radius-l); background: var(--nile); color: #eaf4f2; padding: 22px 20px 20px; }
[data-theme="dark"] .wealth { background: #123b3c; }
.wealth .label { font-size: var(--fs-s); opacity: .8; }
.wealth .big { font-size: var(--fs-xxl); font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
.wealth .big small { font-size: var(--fs-m); font-weight: 500; opacity: .75; margin-inline-start: 6px; }
.wealth .sub { display: flex; gap: 18px; margin-top: 14px; font-size: var(--fs-s); }
.wealth .sub b { display: block; font-size: var(--fs-m); }

/* ---------- الطبقات العائمة ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,20,22,.45); display: grid; align-items: end; animation: fade .15s ease; }
@media (min-width: 700px) { .scrim { place-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; margin: 0 auto; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); animation: rise .2s ease; }
@media (min-width: 700px) { .sheet { border-radius: 24px; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 12px; }
.sheet h3 { margin: 0 0 12px; font-size: var(--fs-l); }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
@keyframes fade { from { opacity: 0; } }
#toast-root { position: fixed; z-index: 60; inset: auto 0 calc(var(--nav-h) + 20px) 0; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-size: var(--fs-s); font-weight: 500; box-shadow: var(--shadow); max-width: 480px; animation: rise .2s ease; }
.toast.error { background: var(--out); color: #fff; }

.empty { text-align: center; padding: 36px 16px; color: var(--ink-2); }
.empty svg { width: 44px; height: 44px; color: var(--ink-3); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: var(--fs-s); }
.banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--ink); }
.banner.error { background: color-mix(in srgb, var(--out) 10%, var(--surface)); }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--in); display: inline-block; }
.sync-dot.off { background: var(--ink-3); } .sync-dot.pending { background: var(--warn); } .sync-dot.err { background: var(--out); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 8px 8px 8px 12px; }
.copybox code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; font-size: var(--fs-s); }
.code-big { font-size: 1.75rem; font-weight: 700; letter-spacing: .2em; direction: ltr; text-align: center; }

/* ---------- المرحلة ٣: المالية ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: var(--fs-s); background: var(--surface); border: 1px solid var(--line); }
.tabs a[aria-selected="true"] { background: var(--nile); color: var(--surface); border-color: var(--nile); }
[data-theme="dark"] .tabs a[aria-selected="true"] { color: #0d1719; }
.month-nav { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 4px; }
.month-nav b { font-size: var(--fs-m); }
.icon-btn[disabled] { opacity: .3; }
.sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum3 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.panel .sum3 > div { background: var(--surface-2); border: 0; }
.sum3 b { font-size: clamp(.8rem, 3.6vw, .98rem); line-height: 1.3; word-break: break-word; }
.sum3 > div { padding: 10px 8px; }
.chips-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip-btn { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 12px; font-size: var(--fs-s); font-weight: 600; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--nile-tint); color: var(--nile); border-color: transparent; }
.small-input { min-height: 42px; padding: 8px 12px; font-size: var(--fs-s); }
.txn-ico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.txn-ico svg { width: 20px; height: 20px; }
.amt { font-weight: 600; white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list > li > .grow { min-width: 0; }
.progress { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 8px; background: var(--nile-2); transition: width .3s ease; }
.progress.warn i { background: var(--warn); } .progress.over i { background: var(--out); } .progress.gold i { background: var(--gold); } .progress.nile i { background: var(--nile-2); }
.amount-wrap { position: relative; }
.amount-wrap .input { padding-inline-end: 56px; }
.amount-cur { position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-weight: 600; pointer-events: none; }
.amount-big { font-size: 1.75rem; font-weight: 700; min-height: 64px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick-btn { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: var(--fs-xs); font-weight: 600; cursor: pointer; }
.quick-btn .ico { color: var(--nile-2); }
.checklist { display: grid; gap: 2px; max-height: 220px; overflow: auto; background: var(--surface-2); border-radius: 12px; padding: 6px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; }
.check-row input { width: 18px; height: 18px; accent-color: var(--nile-2); }
.cat-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.big-num { font-size: var(--fs-xl); font-weight: 700; }
.wealth .icon-btn { color: #eaf4f2; width: 36px; height: 36px; }
.wealth-rate { margin-top: 12px; font-size: var(--fs-xs); opacity: .7; }
.toggle-row { gap: 12px; cursor: pointer; padding: 4px 0; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
[dir="rtl"] details > summary::before { content: "◂ "; }
[dir="rtl"] details[open] > summary::before { content: "▾ "; }
.tap { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- المرحلة ٤: الثروة والذهب ---------- */
.price-table { width: 100%; border-collapse: collapse; font-size: var(--fs-s); }
.price-table th { text-align: start; color: var(--ink-3); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.price-table td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.price-table tr:last-child td { border-bottom: 0; }
.price-table td.num { text-align: start; }
.gold-summary { border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); background: linear-gradient(180deg, var(--gold-tint), var(--surface) 70%); }
.chart { width: 100%; height: auto; display: block; }
.chart-line { fill: none; stroke: var(--nile-2); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart-area { fill: color-mix(in srgb, var(--nile-2) 12%, transparent); }
.wealth.tap { cursor: pointer; }
</style>
</head>
